name: Windows build
on: [push]
jobs:
  build-win:
    continue-on-error: true
    strategy:
      matrix:
        arch:
          - amd64
          - amd64_x86
          - amd64_arm64
        build_type:
          - Release
          - Debug
    runs-on: windows-latest
    steps:
      - name: set up Visual C++ paths
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: check out repository code
        uses: actions/checkout@v4
      - name: prepare release build
        run: meson setup bld --prefix "$((Get-Location).Path)\..\install"
        if: ${{ matrix.build_type == 'Release' }}
      - name: prepare release build
        run: meson setup bld --prefix "$((Get-Location).Path)\..\install" --debug
        if: ${{ matrix.build_type == 'Debug' }}
      - name: build
        run: cd build && ninja
      - name: collect installation
        run: cd build && ninja install
      - name: upload installation archive
        uses: actions/upload-artifact@v4
        with:
          name: midiedit-${{ matrix.arch }}-${{ matrix.build_type }}
          path: install
